# Pile locale Kora Finance. Démarrage : `make up` (voir README).
# Tous les ports sont liés à 127.0.0.1 : rien n'est exposé sur le réseau.

x-api-env: &api-env
  KORA_ENV: local
  KORA_LOG_LEVEL: ${KORA_LOG_LEVEL:-INFO}
  KORA_DATABASE_URL: postgresql+psycopg://kora_app:${KORA_DB_APP_PASSWORD:?lancer make env}@postgres:5432/kora
  KORA_REDIS_URL: redis://redis:6379/0
  KORA_JWT_SECRET: ${KORA_JWT_SECRET:?lancer make env}
  KORA_ENCRYPTION_KEYS: ${KORA_ENCRYPTION_KEYS:?lancer make env}
  # Seul le serveur web appelle l'API : il transmet l'IP du client (X-Forwarded-For).
  # En production, l'API ne doit pas être joignable directement depuis internet.
  KORA_TRUSTED_PROXY_COUNT: "1"
  KORA_AUTH_RATE_LIMIT_PER_MINUTE: ${KORA_AUTH_RATE_LIMIT_PER_MINUTE:-20}
  # Emails : en local, tout part vers Mailpit (aucun email réel n'est envoyé).
  # En production : SMTP du fournisseur choisi, KORA_SMTP_SECURITY=starttls ou tls.
  KORA_SMTP_HOST: mailpit
  KORA_SMTP_PORT: "1025"
  KORA_SMTP_SECURITY: none
  KORA_EMAIL_FROM: Kora Finance <no-reply@kora.local>
  KORA_WEB_PUBLIC_URL: ${KORA_PUBLIC_URL:-http://localhost:3100}
  # Pièces justificatives : Garage en local. En production : point d'accès https:// du
  # fournisseur S3, bucket privé, clé limitée à ce bucket.
  # Les SAUVEGARDES n'utilisent pas ces identifiants : bucket et clé dédiés (KF-09),
  # transmis au seul service « backup » — l'API et le worker ne peuvent pas y toucher.
  KORA_S3_ENDPOINT_URL: http://storage:3900
  KORA_S3_BUCKET: kora
  KORA_S3_ACCESS_KEY_ID: ${KORA_S3_ACCESS_KEY_ID:?lancer make env}
  KORA_S3_SECRET_ACCESS_KEY: ${KORA_S3_SECRET_ACCESS_KEY:?lancer make env}

x-backup-env: &backup-env
  # Sauvegardes (KF-09) : bucket et clé DÉDIÉS, distincts du stockage des pièces.
  # La clé de sauvegarde ne porte aucun droit de suppression (rétention administrée
  # côté fournisseur) ; la clé d'administration de la purge n'est jamais committée ici.
  KORA_BACKUP_S3_ENDPOINT_URL: http://storage:3900
  KORA_BACKUP_S3_BUCKET: kora-backups
  KORA_BACKUP_S3_ACCESS_KEY_ID: ${KORA_BACKUP_S3_ACCESS_KEY_ID:?lancer make env}
  KORA_BACKUP_S3_SECRET_ACCESS_KEY: ${KORA_BACKUP_S3_SECRET_ACCESS_KEY:?lancer make env}

x-garage-env: &garage-env
  GARAGE_RPC_SECRET: ${KORA_GARAGE_RPC_SECRET:?lancer make env}
  GARAGE_ADMIN_TOKEN: ${KORA_GARAGE_ADMIN_TOKEN:?lancer make env}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kora_admin
      POSTGRES_PASSWORD: ${KORA_POSTGRES_ADMIN_PASSWORD:?lancer make env}
      POSTGRES_DB: postgres
      KORA_DB_OWNER_PASSWORD: ${KORA_DB_OWNER_PASSWORD:?lancer make env}
      KORA_DB_APP_PASSWORD: ${KORA_DB_APP_PASSWORD:?lancer make env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
    ports:
      - "127.0.0.1:${KORA_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kora_admin -d kora"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${KORA_REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Serveur SMTP de développement : capture les emails, interface sur 127.0.0.1:58025.
  mailpit:
    image: axllent/mailpit:v1.31.3
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      MP_MAX_MESSAGES: "2000"
    ports:
      - "127.0.0.1:${KORA_MAILPIT_PORT:-58025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Stockage S3 de développement (Garage, un nœud). Image sans shell : le contrôle de
  # santé passe par la CLI de Garage ; l'initialisation par storage-init.
  storage:
    image: dxflrs/garage:v2.4.1
    environment: *garage-env
    volumes:
      - ./infra/garage/garage.toml:/etc/garage.toml:ro
      - garage_data:/var/lib/garage
    ports:
      - "127.0.0.1:${KORA_S3_PORT:-53900}:3900"
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Nœud, clé d'accès et buckets (« kora » pour la pile, « kora-test » pour pytest),
  # plus le bucket et la clé dédiés des sauvegardes (KF-09 : la clé de l'API n'y a
  # jamais accès).
  storage-init:
    image: python:3.13-slim
    user: "65534:65534"
    command: ["python", "-I", "/bootstrap/bootstrap.py"]
    volumes:
      - ./infra/garage/bootstrap.py:/bootstrap/bootstrap.py:ro
    environment:
      GARAGE_ADMIN_URL: http://storage:3903
      GARAGE_ADMIN_TOKEN: ${KORA_GARAGE_ADMIN_TOKEN:?lancer make env}
      S3_ACCESS_KEY_ID: ${KORA_S3_ACCESS_KEY_ID:?lancer make env}
      S3_SECRET_ACCESS_KEY: ${KORA_S3_SECRET_ACCESS_KEY:?lancer make env}
      S3_BUCKETS: kora,kora-test
      S3_BACKUP_KEY_ID: ${KORA_BACKUP_S3_ACCESS_KEY_ID:?lancer make env}
      S3_BACKUP_SECRET: ${KORA_BACKUP_S3_SECRET_ACCESS_KEY:?lancer make env}
      S3_BACKUP_BUCKET: kora-backups
    depends_on:
      storage: { condition: service_healthy }

  # Les migrations sont une étape distincte : l'API ne modifie jamais le schéma au démarrage.
  migrate:
    build: { context: ./apps/api, target: runtime }
    image: kora-api:local
    command: ["alembic", "upgrade", "head"]
    environment:
      KORA_DATABASE_MIGRATION_URL: postgresql+psycopg://kora_owner:${KORA_DB_OWNER_PASSWORD:?lancer make env}@postgres:5432/kora
    depends_on:
      postgres: { condition: service_healthy }

  api:
    image: kora-api:local
    environment: *api-env
    ports:
      - "127.0.0.1:${KORA_API_PORT:-8100}:8000"
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      storage-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    image: kora-api:local
    command: ["dramatiq", "kora.worker.tasks", "--processes", "1", "--threads", "4"]
    environment: *api-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      mailpit: { condition: service_healthy }
      storage-init: { condition: service_completed_successfully }

  # Sauvegardes (KF-09) : conteneur one-shot sous profil, exécuté à la demande —
  # docker compose --profile backup run --rm --no-deps backup python -m kora.scripts.backup …
  # Il ne reçoit que les identifiants de sauvegarde, jamais ceux des pièces ; les
  # services api/worker/migrate/web ne reçoivent jamais ceux des sauvegardes.
  backup:
    profiles: ["backup"]
    image: kora-api:local
    environment: *backup-env

  web:
    build: { context: ./apps/web, target: runtime }
    image: kora-web:local
    environment:
      KORA_API_INTERNAL_URL: http://api:8000
      # https:// en production : cookies « Secure » et upgrade-insecure-requests.
      KORA_PUBLIC_URL: ${KORA_PUBLIC_URL:-http://localhost:3100}
    ports:
      - "127.0.0.1:${KORA_WEB_PORT:-3100}:3000"
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20

  # --- Outillage (profil « tools ») : tests, lint, typage, dans des conteneurs épinglés.
  api-tools:
    profiles: ["tools"]
    build: { context: ./apps/api, target: dev }
    image: kora-api:dev
    user: "${KORA_UID:-1000}:${KORA_GID:-1000}"
    # Dépôt entier monté : certains tests vérifient la documentation générée (docs/).
    working_dir: /repo/apps/api
    volumes:
      - .:/repo
    environment:
      PYTHONPATH: /repo/apps/api/src
      UV_CACHE_DIR: /tmp/uv
      KORA_ENV: test
      KORA_EMAIL_BACKEND: memory
      KORA_WEB_PUBLIC_URL: https://kora.test
      # Test d'intégration SMTP (tests/test_email_smtp.py) contre Mailpit.
      KORA_TEST_MAILPIT_SMTP: mailpit:1025
      KORA_TEST_MAILPIT_API: http://mailpit:8025
      KORA_DATABASE_URL: postgresql+psycopg://kora_app:${KORA_DB_APP_PASSWORD:?lancer make env}@postgres:5432/kora_test
      KORA_DATABASE_MIGRATION_URL: postgresql+psycopg://kora_owner:${KORA_DB_OWNER_PASSWORD:?lancer make env}@postgres:5432/kora_test
      KORA_REDIS_URL: redis://redis:6379/15
      KORA_JWT_SECRET: ${KORA_JWT_SECRET:?lancer make env}
      KORA_ENCRYPTION_KEYS: ${KORA_ENCRYPTION_KEYS:?lancer make env}
      KORA_S3_ENDPOINT_URL: http://storage:3900
      KORA_S3_BUCKET: kora-test
      KORA_S3_ACCESS_KEY_ID: ${KORA_S3_ACCESS_KEY_ID:?lancer make env}
      KORA_S3_SECRET_ACCESS_KEY: ${KORA_S3_SECRET_ACCESS_KEY:?lancer make env}
      RUFF_CACHE_DIR: /tmp/ruff
      MYPY_CACHE_DIR: /tmp/mypy
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      mailpit: { condition: service_healthy }
      storage-init: { condition: service_completed_successfully }

  web-tools:
    profiles: ["tools"]
    image: node:24-bookworm-slim
    user: "${KORA_UID:-1000}:${KORA_GID:-1000}"
    working_dir: /repo/apps/web
    volumes:
      - .:/repo
    environment:
      HOME: /tmp
      npm_config_cache: /tmp/.npm
      NEXT_TELEMETRY_DISABLED: "1"

  e2e:
    profiles: ["e2e"]
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    user: "${KORA_UID:-1000}:${KORA_GID:-1000}"
    working_dir: /repo/apps/web
    ipc: host
    volumes:
      - .:/repo
    environment:
      HOME: /tmp
      CI: ${CI:-}
      E2E_BASE_URL: http://web:3000
      E2E_MAILPIT_URL: http://mailpit:8025
    command: ["npx", "playwright", "test"]
    depends_on:
      web: { condition: service_healthy }

volumes:
  postgres_data:
  redis_data:
  garage_data:
