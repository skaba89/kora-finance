[project]
name = "kora-api"
version = "0.1.0"
description = "Kora Finance — API et worker (FastAPI, SQLAlchemy, Dramatiq)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.161,<0.166",
    "uvicorn[standard]>=0.54,<0.55",
    "sqlalchemy>=2.1.6,<2.2",
    "alembic>=1.20,<1.21",
    "psycopg[binary]>=3.3,<3.4",
    "pydantic>=2.14,<2.15",
    "pydantic-settings>=2.16,<2.17",
    "redis>=8.1,<8.2",
    "dramatiq[redis]>=2.2,<2.3",
    "argon2-cffi>=25.1,<25.2",
    "pyjwt>=2.15,<2.16",
    "pyotp>=2.10,<2.13",
    "cryptography>=50.0,<50.1",
    "segno>=1.6,<1.7",
    "email-validator>=2.3,<2.4",
    "openpyxl>=3.1.5,<3.2",
    "reportlab>=5.0.1,<5.2",
    # Publié chaque jour : version exacte, au moins deux semaines d'ancienneté.
    "boto3==1.43.126",
]

[dependency-groups]
dev = [
    "pytest>=9.1,<9.3",
    "pytest-cov>=7.1,<7.2",
    "httpx2>=2.16,<2.17",
    "ruff>=0.17,<0.18",
    "mypy>=2.4,<2.5",
    "hypothesis>=6.170,<6.171",
    "pypdf>=6.19,<8",
    "time-machine>=3.5,<3.7",
    "types-openpyxl==3.1.5.20261017",
    "types-reportlab==5.1.0.20261104",
    "types-boto3[s3]==1.44.7",
]

# Pas de paquet installable : le code vit dans src/ et PYTHONPATH=src
# (Dockerfile, pytest, alembic). Évite de dépendre d'un backend de build.
[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PL", "PT", "DTZ", "N"]
ignore = [
    "PLR2004",
    # Arguments nommés obligatoires (`*,`) : la lisibilité ne souffre pas du nombre.
    "PLR0913",
]

# Typographie française (tiret demi-cadratin, signe ×, apostrophe typographique).
allowed-confusables = ["–", "×", "’"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107", "S311", "PLR2004"]
# Handlers FastAPI : paramètres injectés (corps, contexte, session, filtres…).
"src/kora/api/**" = ["PLR0917"]
"alembic/**" = ["N999"]
# Migrations : longues contraintes CHECK sur une ligne ; DDL et données figées construits
# à partir de constantes du fichier (aucune saisie utilisateur).
"alembic/versions/**" = ["N999", "E501", "S608"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
explicit_package_bases = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["dramatiq.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/kora"]
branch = true
