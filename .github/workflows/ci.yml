# CI Kora Finance. Les jobs exécutent exactement les mêmes commandes `make` qu'en local,
# dans les mêmes conteneurs épinglés : ce qui passe en local passe en CI, et inversement.
# Protection de branche : exiger le statut « CI / Résultat » sur main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: make secrets-scan

  api:
    name: API (ruff, mypy, pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make env
      - run: python3 scripts/check-runtime-db-separation.py
      - run: make api-lint
      - run: make api-typecheck
      - run: make api-test

  web:
    name: Web (eslint, tsc, vitest, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make env
      - run: make web-install
      - run: make web-lint
      - run: make web-typecheck
      - run: make web-test
      - run: make web-build

  contract:
    name: Contrat d'API à jour
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make env
      - run: make web-install
      - run: make contract

  e2e:
    name: E2E (pile complète + Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make env
      - run: make web-install
      - run: make e2e
      - name: Journaux de la pile en cas d'échec
        if: failure()
        run: docker compose logs --no-color --tail=200
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  restore:
    name: Restauration synthétique (PostgreSQL + pièces chiffrées)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python3 scripts/restore-drill.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: restore-drill-report
          path: artifacts/restore-drill.json
          if-no-files-found: error
          retention-days: 30

  result:
    name: Résultat
    if: always()
    needs: [secrets, api, web, contract, e2e, restore]
    runs-on: ubuntu-24.04
    steps:
      - name: Tous les jobs doivent réussir
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" == "true" ]]; then
            echo "Au moins un job a échoué." >&2
            exit 1
          fi
