# Dépendabot : veille hebdomadaire des dépendances et des actions GitHub.
# Complément du job CI « SCA » : pip-audit et npm audit bloquent les vulnérabilités
# connues sur chaque PR ; Dependabot propose à l'avance les mises à jour de versions.
version: 2

updates:
  - package-ecosystem: pip
    directory: /apps/api
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    labels: [dependencies, api]

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    labels: [dependencies, web]
    # @playwright/test est couplé à l'image Docker de navigateurs des E2E
    # (docker-compose.yml, mcr.microsoft.com/playwright:v<version>-noble) : une
    # mise à jour isolée de l'un sans l'autre casse la CI E2E (binaire chromium
    # absent de l'image). Bump toujours en paire dans la même PR, manuellement.
    ignore:
      - dependency-name: "@playwright/test"
      # ESLint 10 invalide le graphe de dépendances de eslint-config-next 16.4.5
      # et bloque la génération CycloneDX (npm ls ELSPROBLEMS).
      - dependency-name: "eslint"
        versions: [">=10"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    labels: [dependencies, ci]
