# Mode « proxy commun » : un reverse proxy indépendant du serveur (seul propriétaire des
# ports 80/443, projet distinct de Kora) publie Kora. Le serveur web rejoint le réseau
# Docker externe « edge » sous le nom « kora-web » ; aucun port n'est publié par cette
# pile. Site à déclarer dans le proxy :
#
#   <domaine> {
#   	encode zstd gzip
#   	request_body {
#   		max_size 12MB
#   	}
#   	header Strict-Transport-Security "max-age=31536000"
#   	reverse_proxy kora-web:3000
#   }
services:
  web:
    networks:
      default: {}
      edge:
        aliases: [kora-web]

networks:
  edge:
    name: edge
    external: true
