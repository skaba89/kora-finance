# Pile de production Kora Finance sur un VPS (un seul serveur, Docker Compose).
# Seul le proxy HTTPS est joignable depuis internet ; PostgreSQL, Redis, l'API et le
# worker restent sur le réseau interne Docker. Deux modes (choisis dans .env) :
#  - serveur dédié : le Caddy de cette pile (profil « caddy ») tient les ports 80/443 ;
#  - proxy existant : compose.proxy-externe.yml, le web rejoint le réseau « edge »
#    et le proxy déjà en place sur le serveur le publie.
# Mode d'emploi : docs/DEPLOIEMENT.md. Variables : deploy/vps/.env (jamais committé).

name: kora

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

x-api-env: &api-env
  KORA_ENV: production
  KORA_LOG_LEVEL: ${KORA_LOG_LEVEL:-INFO}
  KORA_DATABASE_URL: postgresql+psycopg://kora_app:${KORA_DB_APP_PASSWORD:?}@postgres:5432/kora
  KORA_REDIS_URL: redis://redis:6379/0
  KORA_JWT_SECRET: ${KORA_JWT_SECRET:?}
  KORA_ENCRYPTION_KEYS: ${KORA_ENCRYPTION_KEYS:?}
  # Chaîne : Caddy → web → API. L'API ne fait confiance qu'au serveur web.
  KORA_TRUSTED_PROXY_COUNT: "1"
  KORA_AUTH_RATE_LIMIT_PER_MINUTE: "20"
  KORA_WEB_PUBLIC_URL: https://${KORA_DOMAIN:?}
  # Emails : « disabled » tant qu'aucun fournisseur SMTP n'est configuré.
  KORA_EMAIL_BACKEND: ${KORA_EMAIL_BACKEND:-disabled}
  KORA_EMAIL_FROM: ${KORA_EMAIL_FROM:-Kora Finance <no-reply@kora.invalid>}
  KORA_SMTP_HOST: ${KORA_SMTP_HOST:-localhost}
  KORA_SMTP_PORT: ${KORA_SMTP_PORT:-587}
  KORA_SMTP_SECURITY: ${KORA_SMTP_SECURITY:-starttls}
  KORA_SMTP_USERNAME: ${KORA_SMTP_USERNAME:-}
  KORA_SMTP_PASSWORD: ${KORA_SMTP_PASSWORD:-}
  # Alertes d'exploitation (KF-12) : destinataire des notifications kora.scripts.notify.
  KORA_ALERT_EMAIL: ${KORA_ALERT_EMAIL:-}
  # Pièces justificatives et sauvegardes : buckets S3 privés SÉPARÉS (KF-09), en https.
  # Les identifiants ci-dessous ne touchent que les pièces ; ceux des sauvegardes ne
  # sont transmis qu'au service « backup » (clé sans droit de suppression).
  KORA_S3_ENDPOINT_URL: ${KORA_S3_ENDPOINT_URL:?}
  KORA_S3_REGION: ${KORA_S3_REGION:?}
  KORA_S3_BUCKET: ${KORA_S3_BUCKET:?}
  KORA_S3_ACCESS_KEY_ID: ${KORA_S3_ACCESS_KEY_ID:?}
  KORA_S3_SECRET_ACCESS_KEY: ${KORA_S3_SECRET_ACCESS_KEY:?}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: kora_admin
      POSTGRES_PASSWORD: ${KORA_POSTGRES_ADMIN_PASSWORD:?}
      POSTGRES_DB: postgres
      KORA_DB_OWNER_PASSWORD: ${KORA_DB_OWNER_PASSWORD:?}
      KORA_DB_APP_PASSWORD: ${KORA_DB_APP_PASSWORD:?}
      KORA_DATABASES: kora
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../infra/postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kora_admin -d kora"]
      interval: 10s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 30

  migrate:
    build: { context: ../../apps/api, target: runtime }
    image: kora-api:${KORA_IMAGE_TAG:-prod}
    command: ["alembic", "upgrade", "head"]
    environment:
      KORA_DATABASE_MIGRATION_URL: postgresql+psycopg://kora_owner:${KORA_DB_OWNER_PASSWORD:?}@postgres:5432/kora
    logging: *logging
    depends_on:
      postgres: { condition: service_healthy }

  api:
    image: kora-api:${KORA_IMAGE_TAG:-prod}
    restart: unless-stopped
    logging: *logging
    environment: *api-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30

  worker:
    image: kora-api:${KORA_IMAGE_TAG:-prod}
    restart: unless-stopped
    logging: *logging
    command: ["dramatiq", "kora.worker.tasks", "--processes", "1", "--threads", "4"]
    environment: *api-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  # Sauvegardes (KF-09) : bucket et identifiants DÉDIÉS, jamais présents dans les
  # conteneurs api/worker/web. One-shot sous profil, exécuté à la demande par
  # backup.sh / restore.sh.
  backup:
    image: kora-api:${KORA_IMAGE_TAG:-prod}
    profiles: ["backup"]
    logging: *logging
    # La clé de sauvegarde ne porte aucun droit de suppression : la rétention est
    # administrée côté fournisseur, la purge manuelle avec la clé distincte
    # KORA_BACKUP_ADMIN_S3_* depuis un poste hors VPS.
    environment:
      KORA_BACKUP_S3_ENDPOINT_URL: ${KORA_BACKUP_S3_ENDPOINT_URL:?}
      KORA_BACKUP_S3_REGION: ${KORA_BACKUP_S3_REGION:-garage}
      KORA_BACKUP_S3_BUCKET: ${KORA_BACKUP_S3_BUCKET:?}
      KORA_BACKUP_S3_ACCESS_KEY_ID: ${KORA_BACKUP_S3_ACCESS_KEY_ID:?}
      KORA_BACKUP_S3_SECRET_ACCESS_KEY: ${KORA_BACKUP_S3_SECRET_ACCESS_KEY:?}

  web:
    build: { context: ../../apps/web, target: runtime }
    image: kora-web:${KORA_IMAGE_TAG:-prod}
    restart: unless-stopped
    logging: *logging
    environment:
      KORA_API_INTERNAL_URL: http://api:8000
      KORA_PUBLIC_URL: https://${KORA_DOMAIN:?}
      KORA_EMAIL_BACKEND: ${KORA_EMAIL_BACKEND:-disabled}
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30

  caddy:
    image: caddy:2.11.6-alpine
    profiles: ["caddy"]
    restart: unless-stopped
    logging: *logging
    environment:
      KORA_DOMAIN: ${KORA_DOMAIN:?}
      KORA_ACME_EMAIL: ${KORA_ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web: { condition: service_healthy }

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
